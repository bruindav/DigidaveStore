<!doctype html>
<!-- fix-6: voorbeeldkeuze opgeslagen in Firebase, alleen de beheerder kan de vinkjes zetten -->
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DigidaveStore</title>
<meta name="theme-color" content="#0f1729">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Digidave">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
/* Layout: één kolom met een kop, filterchips en per categorie een raster van projectkaarten. Huisstijl digidave: navy, amber, papier. */
:root{
  --bg:#f6f3ec; --surface:#fffdf8; --ink:#14213a; --muted:#5b6478; --line:#e2dccd;
  --accent:#b8740f; --accent-ink:#ffffff; --navy:#1b2b4b; --chip:#ece6d8;
  --live:#2f7d4f; --proto:#7a5a12;
  --display:"IBM Plex Serif",Georgia,serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1729; --surface:#16213a; --ink:#ece7dc; --muted:#a3abbd; --line:#26324f;
  --accent:#e9a63a; --accent-ink:#1a1206; --navy:#c9d3ea; --chip:#1f2b47; --live:#6cc58f; --proto:#e3c06a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1729; --surface:#16213a; --ink:#ece7dc; --muted:#a3abbd; --line:#26324f;
  --accent:#e9a63a; --accent-ink:#1a1206; --navy:#c9d3ea; --chip:#1f2b47; --live:#6cc58f; --proto:#e3c06a; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding-block:40px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:grid;gap:10px;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:36px;height:36px}
.brand span{font-family:var(--body);font-weight:500;font-size:20px;letter-spacing:.01em;color:var(--navy)}
.peek{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0;font:500 13px var(--body);color:var(--accent);cursor:pointer}
.peek::before{content:"▸";display:inline-block;transition:transform .15s}
.peek[aria-expanded="true"]::before{transform:rotate(90deg)}
.peek span{color:var(--muted);font-weight:400}
.peek:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.shots{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.shots button{flex:none;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--chip);cursor:zoom-in;line-height:0}
.shots img{width:68px;height:121px;object-fit:cover;display:block}
.shots button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
dialog.viewer{border:0;padding:0;background:transparent;max-width:100vw;max-height:100vh;width:100%;height:100%;margin:0}
dialog.viewer::backdrop{background:rgba(6,10,20,.97)}
.viewer-inner{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));color:#f3efe6}
.viewer-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.viewer-top strong{font-size:16px;font-weight:600}
.viewer-top span{font-family:var(--mono);font-size:12px;opacity:.75}
.viewer button.x,.viewer button.nav{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;width:40px;height:40px;font-size:20px;cursor:pointer;flex:none}
.viewer button.x:focus-visible,.viewer button.nav:focus-visible{outline:2px solid #e9a63a}
.viewer-stage{display:flex;align-items:center;justify-content:center;gap:12px;min-height:0}
.viewer-stage img{max-height:100%;max-width:min(100%,520px);object-fit:contain;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#111}
.viewer-foot{display:grid;justify-items:center;gap:8px}
.viewer-cap{text-align:center;font-size:14px;opacity:.9}
.v-pick{display:none;}
body.admin .v-pick{display:inline-flex;align-items:center;gap:8px;font-size:14px;background:rgba(255,255,255,.1);padding:6px 12px;border-radius:999px;cursor:pointer}
.v-pick input{width:18px;height:18px;accent-color:#e9a63a;margin:0}
.v-msg{font-size:13px;color:#e9a63a;min-height:1.2em;text-align:center}
@media (max-width:560px){.viewer button.nav{position:absolute;top:50%;transform:translateY(-50%)}.viewer button.prev{left:max(8px,env(safe-area-inset-left,0px))}.viewer button.next{right:max(8px,env(safe-area-inset-right,0px))}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--bg);font-size:14px;padding:10px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center;z-index:20}
h1{font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,40px);line-height:1.15;margin:0;color:var(--navy);text-wrap:balance}
.lead{margin:0;max-width:62ch;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 32px}
.filters button{font:500 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.filters button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{margin-bottom:40px}
section h2{display:flex;align-items:baseline;gap:10px;font-family:var(--display);font-weight:500;font-size:21px;margin:0 0 4px;color:var(--navy)}
section h2 .count{font-family:var(--mono);font-size:12px;color:var(--muted)}
section > p{margin:0 0 16px;color:var(--muted);font-size:14px;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h3{margin:0;font-size:17px;font-weight:600;line-height:1.3}
.status{flex:none;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:4px;border:1px solid currentColor}
.status.live{color:var(--live)}
.status.proto{color:var(--proto)}
.card p{margin:0;color:var(--ink);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.tags span{font-family:var(--mono);font-size:11px;background:var(--chip);color:var(--muted);padding:2px 7px;border-radius:4px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.open{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;text-decoration:none;padding:8px 14px;border-radius:6px}
.open:hover{filter:brightness(1.05)}
.repo{font-family:var(--mono);font-size:12px;color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--muted)}
.repo:hover{color:var(--ink)}
.nolink{font-size:13px;color:var(--muted);font-style:italic}
footer{border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px}
footer button{background:none;border:0;padding:0;font:inherit;color:var(--muted);text-decoration:underline dotted;cursor:pointer}
footer button:hover{color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.open{transition:filter .15s}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand"><img src="./icons/logo-mark.png" alt="" width="36" height="36"><span>digidave</span></div>
    <h1>Mijn projecten</h1>
    <p class="lead">Een overzicht van de apps en prototypes die ik samen met AI heb gebouwd. Klik op <strong>Open app</strong> om een project direct te starten.</p>
  </header>

  <nav class="filters" aria-label="Filter op categorie" id="filters">
    <button type="button" data-f="alle" aria-pressed="true">Alle</button>
    <button type="button" data-f="werk" aria-pressed="false">Scheepvaart &amp; incidenten</button>
    <button type="button" data-f="vrijwillig" aria-pressed="false">Vrijwilligers &amp; vereniging</button>
    <button type="button" data-f="thuis" aria-pressed="false">Thuis &amp; financiën</button>
    <button type="button" data-f="hulp" aria-pressed="false">Handige tools</button>
    <button type="button" data-f="persoonlijk" aria-pressed="false">Persoonlijk</button>
  </nav>

  <main id="main"></main>

  <dialog class="viewer" id="viewer" aria-label="Screenshots">
    <div class="viewer-inner">
      <div class="viewer-top"><div><strong id="v-title"></strong> <span id="v-count"></span></div><button class="x" id="v-close" type="button" aria-label="Sluiten">✕</button></div>
      <div class="viewer-stage"><button class="nav prev" id="v-prev" type="button" aria-label="Vorige">‹</button><img id="v-img" alt=""><button class="nav next" id="v-next" type="button" aria-label="Volgende">›</button></div>
      <div class="viewer-foot">
        <div class="viewer-cap" id="v-cap"></div>
        <label class="v-pick"><input type="checkbox" id="v-pick"> Toon in voorbeeld</label>
        <div class="v-msg" id="v-msg" aria-live="polite"></div>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <footer><span>Alle apps draaien in de browser. Voor sommige apps moet je eerst inloggen.</span><span id="admin-bar"><button type="button" id="admin-btn">Beheer</button></span></footer>
</div>

<script>
const GH = "https://github.com/bruindav/";
const PAGES = "https://bruindav.github.io/";
const CATS = {
  werk: { title: "Scheepvaart & incidenten", intro: "Prototypes voor het registreren en afhandelen van gebeurtenissen op de vaarweg, bedoeld om oplossingsrichtingen te verkennen en met gebruikers te toetsen." },
  vrijwillig: { title: "Vrijwilligers & vereniging", intro: "Apps die in de praktijk worden gebruikt door vrijwilligers en een vereniging van eigenaars." },
  thuis: { title: "Thuis & financiën", intro: "Persoonlijke apps voor agenda, tuin, financiën en administratie." },
  hulp: { title: "Handige tools", intro: "Kleine hulpmiddelen voor dagelijks gebruik." },
  persoonlijk: { title: "Persoonlijk", intro: "Pagina's voor speciale gelegenheden en mensen die me dierbaar zijn." }
};
const P = [
  { cat:"werk", name:"Incidenten Registratie", repo:"Incident", status:"proto",
    desc:"Registratie van incidenten, stremmingen en storingen op de vaarweg, met een locatiezoeker via PDOK, kaarten van Rijkswaterstaat, protocolstappen en een dag- en nachtmodus.",
    tags:["React","Leaflet","PDOK"] },
  { cat:"werk", name:"Operationeel Portaal Scheepvaart", status:"proto",
    desc:"Uitgebreid prototype met modules voor Melding, Storing, Overtreding, Watermanagement, Stremming en Incident, inclusief tijdlijn, protocollen en een dienstjournaal.",
    tags:["HTML/JS","Leaflet","OpenSeaMap"], nolink:"Lokaal prototype, niet online" },
  { cat:"werk", name:"GRS Database Viewer", status:"proto",
    desc:"Analyseert Excel-exports van incidenten, storingen en stremmingen in de browser, met dashboards, filters, tijdlijn en een AVG-bewuste PDF-export.",
    tags:["SheetJS","HTML/JS"], nolink:"Lokaal prototype, niet online" },
  { cat:"werk", name:"Mobiel Verkeersleider", status:"proto",
    desc:"Demo met dienstjournaal, bemanningsbeheer en een routekaart voor de mobiele verkeersleider.",
    tags:["HTML/JS","Leaflet"], nolink:"Lokaal prototype, niet online" },
  { cat:"werk", name:"Feature Analyse", repo:"Problem-Discovery", url:"https://problem-discovery.davedebruin123-75f.workers.dev/", status:"proto",
    desc:"Interviewtool die met AI in zeven stappen een feature helder krijgt: context, probleem, doel, gebruikers, scope, AVG en open vragen. Het resultaat is een werkdocument met waardehypothese, scope, acceptatiecriteria en actiepunten. Je kiest zelf welk AI-model meedenkt. Inloggen met Google, alleen voor genodigden.",
    tags:["React","Claude API","Cloudflare Workers","Firebase"] },

  { cat:"vrijwillig", name:"HoornaarZoeken", repo:"HornetApp", status:"live",
    desc:"App voor vrijwilligers die Aziatische hoornaars opsporen. Leg waarnemingen en vliegrichtingen vast op de kaart en zoek samen in realtime naar het nest.",
    tags:["Firebase","Leaflet","PWA"],
    shots:{ dir:"hornetapp", captions:["Kaartoverzicht met waarnemingen","Eenvoudig iconen plaatsen","Overzicht per gemeente","Zichtlijn met stopwatch en kompas"] } },
  { cat:"vrijwillig", name:"VvE Administratie", repo:"vve-administratie", status:"live",
    desc:"Leden-, bijdrage- en boekhoudadministratie voor een vereniging van eigenaars, met resultatenrekening, balans en begroting.",
    tags:["Firebase","HTML/JS"] },
  { cat:"vrijwillig", name:"VvE e-learning", repo:"vve-e-learning", status:"live",
    desc:"E-learningplatform voor VvE-bestuursleden, met modules over onder meer financiën, bestuur en onderhoud, en toetsvragen per module.",
    tags:["Firebase","HTML/JS"] },

  { cat:"thuis", name:"MyAgenda", repo:"MyAgenda", status:"live",
    desc:"Gedeelde agenda voor thuis met maand-, week- en dagweergave, een takenlijst, een roostermodule en elke ochtend een overzicht via Telegram en e-mail.",
    tags:["Firebase","PWA","GitHub Actions"] },
  { cat:"thuis", name:"Mijn Tuin", repo:"mijntuinplanten", status:"live",
    desc:"Houd je tuinplanten bij op een zelfgetekende plattegrond, met plantherkenning en een jaarkalender voor bloei en snoei.",
    tags:["Firebase","SVG"] },
  { cat:"thuis", name:"Pensioenplanner", repo:"PensioenBerekenen", status:"live",
    desc:"Leest je pensioenoverzichten in en berekent je inkomen vanaf de pensioendatum, bruto en netto, met AOW, lijfrentes, spaargeld en de waarde van je woning.",
    tags:["React","IndexedDB"] },
  { cat:"thuis", name:"Box 3 Rendement", repo:"werkelijkRendement", url:"https://werkelijkrendement.web.app/", status:"live",
    desc:"Berekent per jaar het werkelijke rendement in box 3, per bank en per belegging, en vergelijkt dat met het forfaitaire rendement voor de aangifte.",
    tags:["Firebase","HTML/JS"] },
  { cat:"thuis", name:"AutoKosten", repo:"AutoKosten", status:"live",
    desc:"Brengt alle vaste en variabele autokosten in kaart, inclusief kosten per kilometer, en vergelijkt die met privé of zakelijk leasen.",
    tags:["React","RDW","CBS"],
    shots:{ dir:"autokosten", captions:["Kosten per categorie en per kilometer","Alle kostenposten per jaar","Eigen auto vergeleken met leasen"] } },
  { cat:"thuis", name:"MuziekApp", repo:"MuziekApp", status:"live",
    desc:"Houd je verzameling cd's en platen bij. Scan de barcode, en artiest, titel en jaar worden automatisch opgezocht via MusicBrainz en Discogs.",
    tags:["Firebase","PWA"],
    shots:{ dir:"muziekapp", captions:["Alle albums met een A-tot-Z-index","Album met tracklijst en uitgaven","Album toevoegen met de barcodescanner","Beheer: streamingdienst, import en opberglocaties"] } },
  { cat:"thuis", name:"Mijn Zaken", repo:"mypersonal", url:"https://raw.githack.com/bruindav/mypersonal/b91d3f99e8dff746f62b3dd04938da06e2082ab5/index.html", label:"Open testversie", status:"proto",
    desc:"Beveiligde kluis voor belangrijke gegevens die een ander nodig heeft als ik het zelf niet meer kan vertellen, zoals adressen en bankzaken.",
    tags:["Firebase","Versleuteld"] },

  { cat:"hulp", name:"Locatietracker", repo:"locatietracker", status:"live",
    desc:"Toont tijdens het wandelen je locatie en looprichting op de kaart, met het spoor van de gelopen route.",
    tags:["Leaflet","Lokaal"] },
  { cat:"hulp", name:"QR Lezer", repo:"qr-lezer", status:"live",
    desc:"Leest QR-codes uit een afbeelding, zonder reclame en zonder kosten.",
    tags:["HTML/JS"] },
  { cat:"hulp", name:"Zonzoeker", repo:"zonzoeker", status:"live",
    desc:"Vergelijkt Europese steden op het actuele weer en laat zien waar de zon schijnt, met per stad een verwachting voor tien dagen.",
    tags:["HTML/JS","Weer-API"] },
  { cat:"persoonlijk", name:"In memoriam Hester", repo:"Hester", status:"live",
    desc:"Herdenkingspagina voor mijn vriendin Hester.",
    tags:["HTML"] },
  { cat:"persoonlijk", name:"Familieweekend Oldenburg", repo:"verassingsweekend", status:"live",
    desc:"Reisverslag van het verrassingsweekend naar Oldenburg, met reisdagboek, stamboom en familiegeschiedenis.",
    tags:["HTML"] }
];

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function card(p){
  const status = p.status === "live" ? '<span class="status live">Online</span>' : '<span class="status proto">Prototype</span>';
  const href = p.url || (p.repo && !p.nolink ? PAGES + p.repo + "/" : "");
  const actions = [
    href ? `<a class="open" href="${href}" target="_blank" rel="noopener">${esc(p.label || "Open app")} ↗</a>` : `<span class="nolink">${esc(p.nolink||"")}</span>`,
    p.repo ? `<a class="repo" href="${GH}${p.repo}" target="_blank" rel="noopener">Code</a>` : ""
  ].join("");
  return `<article class="card">
    <div class="card-top"><h3>${esc(p.name)}</h3>${status}</div>
    <p>${esc(p.desc)}</p>
    ${p.shots ? `<button type="button" class="peek" aria-expanded="false">Toon voorbeeld <span>(${p.shots.captions.length} screenshots)</span></button>
    <div class="shots" hidden data-app="${esc(p.name)}"></div>` : ""}
    <div class="tags">${p.tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>
    <div class="actions">${actions}</div>
  </article>`;
}
function render(f){
  const main = document.getElementById("main");
  main.innerHTML = Object.keys(CATS).filter(k => f==="alle" || f===k).map(k => {
    const items = P.filter(p => p.cat===k);
    return `<section aria-labelledby="h-${k}"><h2 id="h-${k}">${esc(CATS[k].title)}<span class="count">${items.length}</span></h2><p>${esc(CATS[k].intro)}</p><div class="grid">${items.map(card).join("")}</div></section>`;
  }).join("");
}
document.getElementById("filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  document.querySelectorAll("#filters button").forEach(x => x.setAttribute("aria-pressed", x===b ? "true":"false"));
  render(b.dataset.f);
  try{ localStorage.setItem("filter", b.dataset.f) }catch(_){}
});
let start = "alle"; try{ start = localStorage.getItem("filter") || "alle" }catch(_){}
if(!CATS[start]) start = "alle";
document.querySelectorAll("#filters button").forEach(x => x.setAttribute("aria-pressed", x.dataset.f===start ? "true":"false"));
render(start);

// Keuze welke screenshots in het voorbeeld staan (max. 3). Opgeslagen in Firebase, alleen de beheerder kan dit wijzigen.
const MAX_VB = 3;
window.VB = window.VB || {};
function getSel(p){
  let sel = window.VB[p.shots.dir];
  if (!Array.isArray(sel) || !sel.length) sel = [0,1,2];
  return sel.filter(i => i < p.shots.captions.length).slice(0, MAX_VB).sort((a,b)=>a-b);
}
function setSel(p, sel){
  window.VB[p.shots.dir] = sel;
  const msg = document.getElementById("v-msg");
  if (!window.saveVB) { msg.textContent = "Niet opgeslagen: geen verbinding met de database."; return; }
  window.saveVB(p.shots.dir, sel)
    .then(() => { msg.textContent = `Opgeslagen · ${sel.length} van ${MAX_VB} in het voorbeeld` })
    .catch(() => { msg.textContent = "Opslaan mislukt. Ben je ingelogd als beheerder?" });
}
window.refreshStrips = () => document.querySelectorAll(".shots").forEach(st => { if (!st.hidden) fillStrip(st) });
function fillStrip(strip){
  const p = P.find(x => x.name === strip.dataset.app);
  strip.innerHTML = getSel(p).map(i => `<button type="button" data-app="${esc(p.name)}" data-i="${i}" aria-label="Screenshot: ${esc(p.shots.captions[i])}"><img src="./screenshots/${p.shots.dir}/${i+1}-klein.jpg" alt="" width="68" height="121"></button>`).join("");
}

// Screenshot-viewer
const viewer = document.getElementById("viewer");
let vApp = null, vIdx = 0;
function showShot(){
  const s = vApp.shots, n = s.captions.length;
  vIdx = (vIdx + n) % n;
  document.getElementById("v-img").src = `./screenshots/${s.dir}/${vIdx+1}.jpg`;
  document.getElementById("v-img").alt = s.captions[vIdx];
  document.getElementById("v-cap").textContent = s.captions[vIdx];
  document.getElementById("v-title").textContent = vApp.name;
  document.getElementById("v-count").textContent = `${vIdx+1} / ${n}`;
  document.getElementById("v-pick").checked = getSel(vApp).includes(vIdx);
  document.getElementById("v-msg").textContent = "";
  document.getElementById("v-prev").hidden = document.getElementById("v-next").hidden = n < 2;
}
document.getElementById("main").addEventListener("click", e => {
  const pk = e.target.closest(".peek");
  if (pk) {
    const open = pk.getAttribute("aria-expanded") !== "true";
    pk.setAttribute("aria-expanded", open);
    pk.firstChild.textContent = open ? "Verberg voorbeeld " : "Toon voorbeeld ";
    const strip = pk.nextElementSibling; strip.hidden = !open;
    if (open) fillStrip(strip);
    return;
  }
  const b = e.target.closest(".shots button"); if(!b) return;
  vApp = P.find(p => p.name === b.dataset.app); vIdx = +b.dataset.i;
  showShot(); viewer.showModal();
});
document.getElementById("v-pick").addEventListener("change", e => {
  let sel = getSel(vApp);
  const msg = document.getElementById("v-msg");
  if (e.target.checked) {
    if (sel.length >= MAX_VB) { e.target.checked = false; msg.textContent = `Er staan er al ${MAX_VB} in het voorbeeld. Haal er eerst een weg.`; return; }
    sel.push(vIdx);
  } else {
    if (sel.length <= 1) { e.target.checked = true; msg.textContent = "Er moet minstens één screenshot in het voorbeeld staan."; return; }
    sel = sel.filter(i => i !== vIdx);
  }
  sel.sort((a,b)=>a-b);
  msg.textContent = "Bezig met opslaan…";
  setSel(vApp, sel);
  document.querySelectorAll(".shots").forEach(st => { if (st.dataset.app === vApp.name && !st.hidden) fillStrip(st) });
});
document.getElementById("v-prev").onclick = () => { vIdx--; showShot() };
document.getElementById("v-next").onclick = () => { vIdx++; showShot() };
document.getElementById("v-close").onclick = () => viewer.close();
viewer.addEventListener("click", e => { if (e.target.classList.contains("viewer-stage") || e.target.classList.contains("viewer-inner")) viewer.close() });
viewer.addEventListener("keydown", e => { if (e.key === "ArrowLeft") { vIdx--; showShot() } if (e.key === "ArrowRight") { vIdx++; showShot() } });
let tx = null;
viewer.addEventListener("touchstart", e => { tx = e.touches[0].clientX }, { passive: true });
viewer.addEventListener("touchend", e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) { vIdx += dx < 0 ? 1 : -1; showShot() } tx = null });

// Terugknop: eerst het filter terugzetten, daarna twee keer drukken om af te sluiten
let toastTimer, guardTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true }, 2000);
}
history.pushState({ app: "digidavestore" }, "");
window.addEventListener("popstate", () => {
  if (viewer.open) { viewer.close(); history.pushState({ app: "digidavestore" }, ""); return; }
  const active = document.querySelector('#filters button[aria-pressed="true"]');
  if (active && active.dataset.f !== "alle") {
    document.querySelector('#filters button[data-f="alle"]').click();
    history.pushState({ app: "digidavestore" }, "");
    return;
  }
  // Geen extra stap terugzetten: binnen 2 seconden nog eens terug sluit de app echt af
  toast("Druk nog een keer op terug om af te sluiten");
  clearTimeout(guardTimer);
  guardTimer = setTimeout(() => history.pushState({ app: "digidavestore" }, ""), 2000);
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>

}

  if (e.target.id === "admin-btn") {
    const provider = new GoogleAuthProvider();
    try { await signInWithPopup(auth, provider); }
    catch (err) { if (err.code === "auth/popup-blocked" || err.code === "auth/operation-not-supported-in-this-environment") signInWithRedirect(auth, provider); }
  }
  if (e.target.id === "logout-btn") signOut(auth);
});
