<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operationeel Portaal Scheepvaart - Gebeurtenissen - Corridor 3</title>
<style>
  :root{
    --bg:#08080a;
    --panel:#1c1b22;
    --panel-alt:#232229;
    --panel-hover:#26252d;
    --info-block-body:#333846;
    --info-block-head:#1b1e26;
    --info-blue:#6f93f0;
    --border:#302f38;
    --border-soft:#26252d;
    --accent:#e8b73d;
    --accent-bright:#f5d76e;
    --text:#f2f2f3;
    --text-dim:#a7a6ad;
    --text-dimmer:#7c7b82;
    --badge-bg:#3a3942;
    --red:#d64545;
    --amber-icon:#c98a1f;
    --status-behandeling:#e8b73d;
    --status-aangemeld:#9a99a1;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  /* ===== HEADER ===== */
  .topbar{
    height:44px;
    min-height:44px;
    background:var(--bg);
    display:flex;
    align-items:center;
    padding:0 16px;
    border-bottom:1px solid var(--border-soft);
  }
  .topbar .hamburger{
    width:20px;height:16px;
    display:flex;flex-direction:column;justify-content:space-between;
    margin-right:16px;cursor:pointer;
  }
  .topbar .hamburger span{display:block;height:2px;background:var(--text-dim);}
  .topbar .title{
    font-size:15px;
    color:var(--text);
    font-weight:400;
    letter-spacing:.2px;
  }
  .topbar .spacer{flex:1;}
  .topbar .right{
    display:flex;align-items:center;gap:18px;
    color:var(--text-dim);
    font-size:13px;
  }
  .topbar .avatar{
    width:26px;height:26px;border-radius:50%;
    background:var(--panel-alt);
    border:1px solid var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:600;color:var(--accent);
  }
  .topbar .bell{width:16px;height:16px;color:var(--text-dim);}

  /* ===== SUBTAB (Corridor 3) ===== */
  .subtabbar{
    height:30px;min-height:30px;
    background:var(--bg);
    display:flex;align-items:flex-end;
    padding:0 16px;
    border-bottom:1px solid var(--border-soft);
  }
  .subtab{
    color:var(--accent);
    font-size:13px;
    padding:6px 4px 8px 4px;
    border-bottom:2px solid var(--accent);
    cursor:default;
  }

  /* ===== MAIN LAYOUT ===== */
  .main{
    flex:1;
    display:flex;
    overflow-x:auto;
    overflow-y:hidden;
  }

  /* ---- LEFT PANEL ---- */
  .left-panel-wrap{
    display:flex;
    flex-shrink:0;
    border-right:1px solid var(--border-soft);
    overflow:hidden;
    transition:width .18s ease;
    width:494px;
  }
  .left-panel-wrap.collapsed{
    width:24px;
  }
  .collapse-rail{
    width:24px;
    min-width:24px;
    background:var(--bg);
    border-right:1px solid var(--border-soft);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding-top:14px;
    cursor:pointer;
  }
  .collapse-rail:hover{background:var(--panel-hover);}
  .collapse-rail .caret{
    width:16px;height:16px;
    color:var(--text-dim);
    transition:transform .18s;
  }
  .left-panel-wrap.collapsed .collapse-rail .caret{
    transform:rotate(180deg);
  }
  .collapse-rail:hover .caret{color:var(--accent);}
  .left-panel{
    width:470px;
    min-width:470px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .left-panel-wrap.collapsed .left-panel{
    display:none;
  }
  .list-tabs{
    display:flex;align-items:center;
    padding:10px 12px;
    gap:18px;
    border-bottom:1px solid var(--border-soft);
  }
  .list-tab{
    font-size:13px;color:var(--text-dim);
    cursor:pointer;
    padding-bottom:2px;
  }
  .list-tab.active{
    color:var(--text);
    border-bottom:2px solid var(--accent);
    font-weight:600;
  }
  .list-tabs .grow{flex:1;}
  .btn-nieuw{
    background:transparent;
    border:1px solid var(--accent);
    color:var(--accent);
    font-size:12px;
    padding:5px 10px;
    border-radius:2px;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-nieuw:hover{background:rgba(232,183,61,.08);}
  .icon-btn{
    width:28px;height:28px;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);
    cursor:pointer;
    border-radius:3px;
  }
  .icon-btn:hover{background:var(--panel-hover);}
  .toggle{
    width:34px;height:18px;
    border-radius:9px;
    background:var(--accent);
    position:relative;
    cursor:pointer;
    flex-shrink:0;
  }
  .toggle .knob{
    position:absolute;top:2px;right:2px;
    width:14px;height:14px;border-radius:50%;
    background:#1a1a1a;
    transition:right .15s;
  }
  .toggle.off{background:#3a3942;}
  .toggle.off .knob{right:18px;background:#8a8990;}

  .event-list{
    flex:1;
    overflow-y:auto;
  }
  .event-item{
    padding:10px 12px 12px 12px;
    border-bottom:1px solid var(--border-soft);
    cursor:pointer;
    position:relative;
  }
  .event-item:hover{background:var(--panel-hover);}
  .event-item.selected{
    background:var(--panel-alt);
    box-shadow:inset 3px 0 0 var(--accent);
  }
  .event-id{
    font-size:10px;color:var(--text-dimmer);
    margin-bottom:3px;
    padding-left:26px;
  }
  .event-row{
    display:flex;align-items:flex-start;gap:8px;
  }
  .event-icon{
    width:18px;height:18px;flex-shrink:0;margin-top:2px;
  }
  .event-body{flex:1;min-width:0;}
  .event-title-row{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  }
  .event-title{
    font-size:13.5px;font-weight:600;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .event-status{
    font-size:11.5px;white-space:nowrap;flex-shrink:0;
  }
  .event-status.behandeling{color:var(--status-behandeling);}
  .event-status.aangemeld{color:var(--status-aangemeld);}
  .event-status.beeindigd{color:var(--text-dimmer);}
  .event-desc-row{
    display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:2px;
  }
  .event-desc{
    font-size:12px;color:var(--text-dim);
    line-height:1.4;
  }
  .event-badge{
    font-size:11.5px;color:var(--text-dim);white-space:nowrap;flex-shrink:0;
  }

  .empty-tab-msg{
    padding:40px 20px;text-align:center;color:var(--text-dimmer);font-size:13px;
  }

  /* ---- RIGHT PANEL ---- */
  .right-panel{
    flex:1;
    min-width:560px;
    overflow-y:auto;
    padding:20px 24px 40px 24px;
  }
  .placeholder-panel{
    height:100%;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:8px;
    color:var(--text-dimmer);
  }
  .placeholder-panel svg{opacity:.35;margin-bottom:6px;}
  .placeholder-panel .msg{font-size:15px;color:var(--text-dim);}
  .placeholder-panel .sub{font-size:12.5px;}

  .incident-header{
    display:flex;justify-content:space-between;align-items:flex-start;
    margin-bottom:16px;
  }
  .incident-header h1{
    font-size:17px;font-weight:600;margin:0 0 4px 0;color:var(--text);
  }
  .incident-header .op-datum{
    font-size:12.5px;color:var(--text-dim);
  }
  .incident-header .dossier{
    font-size:12.5px;color:var(--text-dim);white-space:nowrap;padding-top:2px;
  }
  .dossier-toggle{
    display:flex;align-items:center;gap:7px;
    cursor:pointer;
    user-select:none;
  }
  .dossier-toggle:hover{color:var(--accent);}
  .dossier-toggle .chev{
    width:14px;height:14px;color:var(--text-dim);
    transition:transform .15s;
    flex-shrink:0;
  }
  .dossier-toggle:hover .chev{color:var(--accent);}
  .dossier-toggle.open .chev{transform:rotate(180deg);}

  .info-toggle-bar{
    display:flex;align-items:center;gap:8px;
    padding:7px 10px;
    background:var(--panel-alt);
    border:1px solid var(--border-soft);
    cursor:pointer;
    margin-bottom:2px;
    user-select:none;
  }
  .info-toggle-bar:hover{background:var(--panel-hover);}
  .info-toggle-bar .lab{
    font-size:12.5px;color:var(--text-dim);font-weight:600;
    letter-spacing:.3px;
  }
  .info-toggle-bar .chev{
    width:14px;height:14px;color:var(--text-dim);
    transition:transform .15s;
  }
  .info-toggle-bar.open .chev{transform:rotate(180deg);}
  .info-cards-wrap{
    margin-bottom:14px;
  }
  .info-cards-wrap.collapsed .info-cards{
    display:none;
  }
  .info-cards{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:2px;
  }
  .info-card{
    background:var(--info-block-body);
    display:flex;flex-direction:column;
  }
  .info-card .head{
    background:var(--info-block-head);
    padding:8px 12px;
    font-size:13px;font-weight:600;color:var(--info-blue);
    border-bottom:1px solid var(--border-soft);
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .protocol-open-btn{
    width:15px;height:15px;color:var(--accent);
    cursor:pointer;flex-shrink:0;
  }
  .protocol-open-btn:hover{color:var(--accent-bright);}
  .info-card .body{
    padding:10px 12px;
    flex:1;
    font-size:12.5px;
    display:flex;flex-direction:column;gap:6px;
  }
  .info-field{display:flex;justify-content:space-between;gap:6px;color:var(--text);}
  .info-field .lab{color:var(--text-dim);}
  .info-field .lab:before{content:"• ";color:var(--text-dim);}
  .info-field .val{font-weight:600;text-align:right;}
  .info-plain{color:var(--text);font-weight:500;}
  .info-empty{color:var(--text-dimmer);}

  /* ---- Waar: locatie, nadere aanduiding, MVL-inzet, coördinaten-tooltip ---- */
  .waar-name{
    color:var(--info-blue);text-decoration:underline;
    font-weight:600;font-size:13px;cursor:pointer;
  }
  .waar-name:hover{color:#8fabf5;}
  .waar-sub{color:var(--text-dim);font-size:12px;margin-top:1px;}

  .info-icon-wrap{position:relative;display:inline-flex;cursor:help;}
  .info-icon-wrap .info-ic{width:14px;height:14px;color:var(--info-blue);}
  .coord-tooltip{
    position:absolute;top:20px;right:0;
    background:#14161c;
    border:1px solid var(--border);
    padding:10px 14px;
    min-width:230px;
    font-size:12px;
    opacity:0;visibility:hidden;
    transition:opacity .12s;
    z-index:80;
    box-shadow:0 10px 26px rgba(0,0,0,.55);
  }
  .info-icon-wrap:hover .coord-tooltip{opacity:1;visibility:visible;}
  .coord-row{
    display:flex;justify-content:space-between;gap:16px;
    padding:3px 0;color:var(--text-dim);white-space:nowrap;
  }
  .coord-row .v{color:var(--text);font-weight:700;}

  /* ---- chips: betrokkenen / hulpverleners / MVL-inzet ---- */
  .chip-group-label{
    font-size:10.5px;color:var(--text-dimmer);
    letter-spacing:.4px;margin:10px 0 6px 0;
    text-transform:uppercase;
  }
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    display:inline-flex;align-items:center;gap:5px;
    border:1px solid rgba(111,147,240,.45);
    color:var(--info-blue);font-size:12px;font-weight:600;
    padding:4px 10px;border-radius:12px;
    background:rgba(111,147,240,.07);
    white-space:nowrap;
  }
  .chip .dot{width:7px;height:7px;border-radius:50%;background:#e2574c;flex-shrink:0;}
  .chip svg{width:13px;height:13px;flex-shrink:0;}

  .info-cards.cols-3{grid-template-columns:repeat(3, 1fr);}

  /* ---- Edit mode (bv. Overtreding/Watermanagement kaartje) ---- */
  .edit-form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-bottom:10px;
    align-items:stretch;
  }
  .toelichting-col{display:flex;flex-direction:column;height:100%;}
  .toelichting-col .edit-field{flex:1;display:flex;flex-direction:column;margin-bottom:0;}
  .toelichting-col .edit-textarea{flex:1;}
  .edit-field{margin-bottom:9px;}
  .edit-field .flabel{font-size:11px;color:var(--text-dimmer);margin-bottom:3px;}
  .edit-field .fval-static{font-size:13px;color:var(--text);}
  .edit-input, .edit-textarea{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    font-size:13px;
    padding:5px 8px;
    font-family:inherit;
  }
  .edit-input:focus, .edit-textarea:focus{outline:1px solid var(--accent);border-color:var(--accent);}
  .edit-textarea{min-height:84px;resize:vertical;}
  .edit-input-icon-wrap{position:relative;}
  .edit-input-icon-wrap input{padding-right:30px;}
  .edit-input-icon-wrap svg{
    position:absolute;right:8px;top:25px;
    width:14px;height:14px;color:var(--text-dim);
    pointer-events:none;
  }
  .edit-radio-group{display:flex;gap:20px;margin-bottom:9px;}
  .edit-radio{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text);cursor:pointer;}
  .edit-radio input{accent-color:var(--accent);}
  .edit-checkbox-group{display:flex;gap:20px;margin-top:1px;}
  .edit-checkbox{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-dim);cursor:pointer;}
  .edit-checkbox input{accent-color:var(--accent);}
  .read-checkbox-row{display:flex;gap:22px;margin-top:6px;font-size:12.5px;color:var(--text-dim);}
  .read-checkbox-row .on{color:var(--text);}
  .edit-footer{
    display:flex;justify-content:flex-end;gap:10px;
    margin-top:2px;padding-top:8px;
    border-top:1px solid var(--border-soft);
  }
  .edit-btn{
    display:flex;align-items:center;gap:6px;
    padding:6px 13px;font-size:12.5px;font-weight:700;
    border:1px solid var(--border);color:var(--text-dim);
    cursor:pointer;background:transparent;
  }
  .edit-btn svg{width:13px;height:13px;}
  .edit-btn:hover{border-color:var(--text-dim);color:var(--text);}
  .edit-btn.primary{border-color:var(--accent);color:var(--accent);}
  .edit-btn.primary:hover{background:rgba(232,183,61,.08);color:var(--accent-bright);border-color:var(--accent-bright);}

  /* ---- Locatie: doorzoekbaar veld met gecategoriseerde dropdown ---- */
  .loc-field-wrap{position:relative;}
  .loc-input-wrap{position:relative;}
  .loc-input-wrap input{padding-right:30px;}
  .loc-search-icon{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;color:var(--text-dim);
    pointer-events:none;
  }
  .loc-clear-icon{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:17px;height:17px;color:var(--accent);
    cursor:pointer;
    display:none;
  }
  .loc-clear-icon:hover{color:var(--accent-bright);}
  .loc-input-wrap.has-value .loc-search-icon{display:none;}
  .loc-input-wrap.has-value .loc-clear-icon{display:block;}
  .loc-field-label-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px;}
  .loc-map-btn{
    display:flex;align-items:center;gap:4px;
    color:var(--accent);font-size:11px;font-weight:600;
    cursor:pointer;white-space:nowrap;
  }
  .loc-map-btn:hover{color:var(--accent-bright);}
  .loc-map-btn svg{width:12px;height:12px;}
  .loc-dropdown{
    position:absolute;top:100%;left:0;right:0;margin-top:4px;
    background:#1c1e26;border:1px solid var(--border);
    max-height:280px;overflow-y:auto;
    z-index:120;
    box-shadow:0 14px 30px rgba(0,0,0,.55);
    display:none;
  }
  .loc-dropdown.open{display:block;}
  .loc-group-label{padding:7px 12px 3px 12px;font-size:11px;color:var(--text-dimmer);}
  .loc-item{padding:6px 12px;font-size:13px;color:var(--text);cursor:pointer;}
  .loc-item.indent{padding-left:30px;}
  .loc-item:hover{background:var(--panel-hover);color:var(--accent);}
  .loc-empty{padding:10px 12px;font-size:12.5px;color:var(--text-dimmer);}

  /* ---- Naam vaartuig: doorzoekbare vaartuiglijst (bij Beroepsvaart) ---- */
  .vessel-dropdown{min-width:100%;width:max-content;max-width:none;}
  .vessel-item{
    display:flex;align-items:center;gap:10px;
    padding:8px 12px;
    cursor:pointer;
    border-bottom:1px solid var(--border-soft);
  }
  .vessel-item:last-child{border-bottom:none;}
  .vessel-item:hover{background:var(--panel-hover);}
  .vessel-item .v-icon{width:20px;height:20px;flex-shrink:0;}
  .vessel-item .v-main{min-width:190px;}
  .vessel-item .v-name{font-weight:700;font-size:12.5px;color:var(--text);}
  .vessel-item .v-type{font-size:11px;color:var(--info-blue);margin-top:1px;}
  .vessel-item .v-stats{
    display:grid;grid-template-columns:auto auto;
    gap:2px 26px;font-size:11px;color:var(--text-dim);
    white-space:nowrap;
  }
  .vessel-item .v-stats b{color:var(--text);font-weight:600;}

  /* ===== POPUP: Kaart (nadere locatie kiezen op vaarweg) ===== */
  .map-modal-panel{
    padding:0;
    width:760px;max-width:95vw;
  }
  .map-header{
    background:#000;
    color:var(--text);
    font-size:14px;
    padding:12px 20px;
    border-bottom:1px solid var(--border-soft);
  }
  .map-canvas-wrap{
    position:relative;
    height:400px;
    overflow:hidden;
    background:#bfe0ef;
    cursor:crosshair;
  }
  .map-canvas{
    position:absolute;inset:0;
    transform-origin:center center;
    transition:transform .15s ease;
  }
  .map-canvas svg{width:100%;height:100%;display:block;}
  .map-zoom-controls{
    position:absolute;top:12px;left:12px;z-index:5;
    display:flex;flex-direction:column;
  }
  .map-zoom-btn{
    width:26px;height:24px;
    background:#fff;color:#222;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;
    cursor:pointer;
    border:1px solid #b8b8b8;
  }
  .map-zoom-btn:first-child{border-radius:2px 2px 0 0;}
  .map-zoom-btn:last-child{border-radius:0 0 2px 2px;border-top:none;}
  .map-zoom-btn:hover{background:#f0f0f0;}
  .map-pin{
    position:absolute;
    width:26px;height:26px;
    transform:translate(-50%,-92%);
    pointer-events:none;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));
    z-index:6;
  }
  .map-pin svg{width:100%;height:100%;}
  .map-spec-row{
    padding:12px 20px;
    background:var(--bg);
    border-top:1px solid var(--border-soft);
  }
  .map-spec-row .flabel{font-size:11px;color:var(--text-dimmer);margin-bottom:4px;}
  .map-spec-row .loc-input-wrap input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    font-size:13px;
    padding:7px 30px 7px 9px;
    font-family:inherit;
  }
  .map-spec-row .loc-input-wrap input:focus{outline:1px solid var(--accent);border-color:var(--accent);}
  .map-footer{
    display:flex;justify-content:flex-end;gap:24px;
    padding:12px 20px;
    background:var(--bg);
    border-top:1px solid var(--border-soft);
  }
  .map-footer .action-link{font-size:13px;font-weight:700;}

  .action-row{
    display:flex;justify-content:flex-end;align-items:center;gap:22px;
    margin-bottom:18px;
    font-size:13px;
  }
  .action-link{
    color:var(--accent);
    cursor:pointer;
    display:flex;align-items:center;gap:5px;
    white-space:nowrap;
  }
  .action-link:hover{color:var(--accent-bright);}

  .vervolg-wrap{position:relative;}
  .vervolg-menu{
    position:absolute;top:100%;right:0;margin-top:8px;
    background:var(--panel-alt);
    border:1px solid var(--border);
    min-width:250px;
    max-height:75vh;
    overflow-y:auto;
    box-shadow:0 12px 30px rgba(0,0,0,.55);
    z-index:60;
    padding:6px 0;
    display:none;
  }

// Berekent de titel/subtitel van compacte gebeurtenissen (Overtreding/
// Watermanagement/Melding) live vanuit de actuele (eventueel gewijzigde)
// gegevens van de hoofd-processtap, in plaats van een vaste tekst die alleen
// bij het aanmaken werd vastgelegd.
const COMPACT_TYPES = ['overtreding','watermanagement','melding'];

// Geeft de gebeurtenis die op dit moment rechts getoond wordt (rekening
// houdend met tab en concept-selectie).
function getCurrentEv(){
  return currentTab === 'historie'
    ? historyEvents[historySelectedIndex]
    : (adhocSelection || events[selectedIndex]);
}

// Berekent de titel/subtitel van compacte gebeurtenissen (Overtreding/
// Watermanagement/Melding) live vanuit de actuele (eventueel gewijzigde)
// gegevens van de hoofd-processtap, in plaats van een vaste tekst die alleen
// bij het aanmaken werd vastgelegd.
function computeCompactHeader(ev){
  const d = ev.detail;
  let mainStep = null;
  for(const g of d.timeline){
    for(const s of g.steps){
      if(s.form && s.form.type === ev.type){ mainStep = s; break; }
    }
    if(mainStep) break;
  }
  if(!mainStep) return { line1: d.headerLine1, line2: d.headerLine2 };

  const f = mainStep.form;
  if(ev.type === 'watermanagement'){
    return { line1: `${f.tijd} · Watermanagement · ${f.activiteit}`, line2: f.locatie };
  }
  if(ev.type === 'overtreding'){
    return { line1: `${f.tijd} · Overtreding · ${f.varendeEenheid}`, line2: f.reden };
  }
  if(ev.type === 'melding'){
    return { line1: `${f.tijd} · Melding`, line2: f.soort };
  }
  return { line1: d.headerLine1, line2: d.headerLine2 };
}

// Werkt de titelbalk direct in de DOM bij (zonder het hele paneel opnieuw op
// te bouwen) nadat een processtap is opgeslagen die de hoofdgegevens van een
// compacte gebeurtenis bevat.
function refreshCompactHeaderInPlace(){
  const ev = getCurrentEv();
  if(!ev || !COMPACT_TYPES.includes(ev.type)) return;
  const h = computeCompactHeader(ev);
  const h1El = document.querySelector('.incident-header h1');
  const subEl = document.querySelector('.incident-header .op-datum');
  if(h1El) h1El.textContent = h.line1;
  if(subEl) subEl.textContent = h.line2;
}

// Zet een concept-opmerking klaar (nog NIET in de tijdlijn/lijst) en toont
// 'm bovenaan in edit mode. Pas bij Opslaan wordt hij echt toegevoegd.
function addOpmerking(ev){
  if(!ev || !ev.detail) return;
  const now = new Date();
  const datum = `${pad2(now.getDate())}-${pad2(now.getMonth()+1)}-${now.getFullYear()}`;
  const tijd = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
  draftOpmerkingStep = {
    time:tijd, num:null, name:'Opmerking', detail:'', roles:['RV', randomCredential()],
    form:{
      type:'opmerking',
      editable:true,
      gebeurtenis:'Opmerking',
      datum, tijd,
      titel:'',
      opmerking:''
    }
  };
  draftOpmerkingEv = ev;
  renderRight();
}

function renderDraftOpmerkingCardHtml(s){
  return `
    <div class="step-card open editing" id="draftOpmerkingCard">
      <div class="step-head" style="cursor:default;">
        <div class="step-time">${s.time}</div>
        <div class="step-num" style="visibility:hidden;"></div>
        <div class="step-name" id="draftStepNamePreview">${s.form.titel || s.name}</div>
        <div class="step-detail"></div>
        <div class="step-right">
          ${s.roles.map(r=>`<span class="role-badge">${r}</span>`).join('')}
        </div>
      </div>
      <div class="step-body" style="display:block;">${buildOpmerkingEditHtml(s)}</div>
    </div>
  `;
}

function wireDraftOpmerkingCard(ev){
  const card = document.getElementById('draftOpmerkingCard');
  if(!card) return;

  const titelInput = card.querySelector('.f-titel');
  const namePreview = card.querySelector('#draftStepNamePreview');
  if(titelInput && namePreview){
    titelInput.addEventListener('input', ()=>{
      namePreview.textContent = titelInput.value.trim() ? `Opmerking - ${titelInput.value.trim()}` : 'Opmerking';
    });
  }

  card.querySelector('.edit-cancel').addEventListener('click', ()=>{
    draftOpmerkingStep = null;
    draftOpmerkingEv = null;
    renderRight();
  });

  card.querySelector('.edit-save').addEventListener('click', ()=>{
    const s = draftOpmerkingStep;
    s.form.datum = card.querySelector('.f-datum').value;
    s.form.tijd = card.querySelector('.f-tijd').value;
    s.form.titel = card.querySelector('.f-titel').value;
    s.form.opmerking = card.querySelector('.f-opmerking').value;
    s.time = s.form.tijd;
    s.name = s.form.titel.trim() ? `Opmerking - ${s.form.titel.trim()}` : 'Opmerking';
    s.detail = s.form.opmerking.slice(0, 60) + (s.form.opmerking.length > 60 ? '…' : '');

    const d = ev.detail;
    const datum = s.form.datum;
    if(d.timeline.length && d.timeline[0].date === datum){
      d.timeline[0].steps.unshift(s);
    } else {
      d.timeline.unshift({date:datum, steps:[s]});
    }

    draftOpmerkingStep = null;
    draftOpmerkingEv = null;

    // Een opmerking toevoegen aan een reeds bestaande gebeurtenis is een
    // wijziging; bij een nog niet opgeslagen nieuwe gebeurtenis (adhocSelection)
    // blijft de status gewoon Aangemeld tot de eerste keer opslaan.
    if(ev !== adhocSelection){
      markEventChanged(ev);
    }

    renderRight();
  });
}

// Zet een concept "Inzet Mobiel Verkeersleider"-kaartje klaar (nog NIET in de
// tijdlijn). Pas bij Opslaan wordt het echt toegevoegd én verschijnt de
// inzet in het Waar-blokje van de infokaart (net als bij Incident).
function addMvlStep(ev){
  if(!ev || !ev.detail) return;
  const now = new Date();
  const datum = `${pad2(now.getDate())}-${pad2(now.getMonth()+1)}-${now.getFullYear()}`;
  const tijd = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
  draftMvlStep = {
    time:tijd, num:null, name:'Inzet Mobiel Verkeersleider', detail:'Vaartuig/werkplek (Telefoonnummer)', roles:['OPR', randomCredential()],
    form:{
      type:'mvl',
      editable:true,
      gebeurtenis:'Inzet Mobiel Verkeersleider',
      datum, tijd,
      vaartuigWerkplek:'',
      telefoonnummer:'',
      toelichting:''
    }
  };
  draftMvlEv = ev;
  renderRight();
}

function renderDraftMvlCardHtml(s){
  return `
    <div class="step-card open editing" id="draftMvlCard">
      <div class="step-head" style="cursor:default;">
        <div class="step-time">${s.time}</div>
        <div class="step-num" style="visibility:hidden;"></div>
        <div class="step-name">${s.name}</div>
        <div class="step-detail">${s.detail}</div>
        <div class="step-right">
          ${s.roles.map(r=>`<span class="role-badge">${r}</span>`).join('')}
        </div>
      </div>
      <div class="step-body" style="display:block;">${buildMvlEditHtml(s)}</div>
    </div>
  `;
}

function wireDraftMvlCard(ev){
  const card = document.getElementById('draftMvlCard');
  if(!card) return;

  card.querySelector('.edit-cancel').addEventListener('click', ()=>{
    draftMvlStep = null;
    draftMvlEv = null;
    renderRight();
  });

  card.querySelector('.edit-save').addEventListener('click', ()=>{
    const s = draftMvlStep;
    s.form.datum = card.querySelector('.f-datum').value;
    s.form.tijd = card.querySelector('.f-tijd').value;
    s.form.vaartuigWerkplek = card.querySelector('.f-vaartuig-werkplek').value;
    s.form.telefoonnummer = card.querySelector('.f-telefoonnummer').value;
    s.form.toelichting = card.querySelector('.f-toelichting').value;
    s.time = s.form.tijd;

    const d = ev.detail;
    const datum = s.form.datum;
    if(d.timeline.length && d.timeline[0].date === datum){
      d.timeline[0].steps.unshift(s);
    } else {
      d.timeline.unshift({date:datum, steps:[s]});
    }

    // Zichtbaar maken in het Waar-blokje van de infokaart, net als bij Incident.
    if(typeof d.waar !== 'object'){
      d.waar = { naam: d.waar, mvl: [] };
    }
    if(!Array.isArray(d.waar.mvl)) d.waar.mvl = [];
    if(s.form.vaartuigWerkplek) d.waar.mvl.push(s.form.vaartuigWerkplek);

    draftMvlStep = null;
    draftMvlEv = null;

    if(ev !== adhocSelection){
      markEventChanged(ev);
    }

    renderRight();
  });
}

let mapZoomLevel = 1;

function openLocationMapPopup(locatieLabel, specInputEl, existingSpecValue){
  const existing = document.getElementById('mapPopupOverlay');
  if(existing) existing.remove();
  mapZoomLevel = 1;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'mapPopupOverlay';
  overlay.innerHTML = `
    <div class="modal-panel map-modal-panel">
      <div class="map-header">Kaart</div>
      <div class="map-canvas-wrap" id="mapCanvasWrap">
        <div class="map-zoom-controls">
          <div class="map-zoom-btn" id="mapZoomIn">+</div>
          <div class="map-zoom-btn" id="mapZoomOut">&minus;</div>
        </div>
        <div class="map-canvas" id="mapCanvas">${MAP_SVG}</div>
        <div class="map-pin" id="mapPin" style="left:50%;top:50%;">
          <svg viewBox="0 0 24 24" fill="#ffffff" stroke="#1b1e26" stroke-width="1"><path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8z"/><circle cx="12" cy="10" r="2.4" fill="#1b1e26"/></svg>
        </div>
      </div>
      <div class="map-spec-row">
        <div class="flabel">Locatie specificatie</div>
        <div class="loc-input-wrap">
          <input type="text" id="mapNadereLocatieInput" placeholder="Typ nadere locatie..." value="${existingSpecValue||''}" autocomplete="off">
          <svg class="loc-clear-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="12" r="10"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="#14161c" stroke-width="1.8"/></svg>
        </div>
      </div>
      <div class="map-footer">
        <div class="action-link" id="mapCancelBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9.5"/><line x1="8.5" y1="8.5" x2="15.5" y2="15.5"/><line x1="15.5" y1="8.5" x2="8.5" y2="15.5"/></svg>
          Annuleren
        </div>
        <div class="action-link" id="mapSelectBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>
          Selecteren
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const wrapEl = document.getElementById('mapCanvasWrap');
  const canvasEl = document.getElementById('mapCanvas');
  const pinEl = document.getElementById('mapPin');
  const nadereInput = document.getElementById('mapNadereLocatieInput');
  const nadereInputWrap = nadereInput.closest('.loc-input-wrap');
  const nadereClear = nadereInputWrap.querySelector('.loc-clear-icon');

  const syncClear = ()=> nadereInputWrap.classList.toggle('has-value', !!nadereInput.value);
  syncClear();
  nadereInput.addEventListener('input', syncClear);
  nadereClear.addEventListener('mousedown', (e)=>{
    e.preventDefault();
    nadereInput.value = '';
    syncClear();
    nadereInput.focus();
  });

  function movePinTo(xPct, yPct){
    pinEl.style.left = xPct + '%';
    pinEl.style.top = yPct + '%';
  }

  wrapEl.addEventListener('click', (e)=>{
    if(e.target.closest('.map-zoom-btn')) return;
    const rect = wrapEl.getBoundingClientRect();
    const xPct = ((e.clientX - rect.left) / rect.width) * 100;
    const yPct = ((e.clientY - rect.top) / rect.height) * 100;
    movePinTo(xPct, yPct);
    nadereInput.focus();
  });

  document.getElementById('mapZoomIn').addEventListener('click', (e)=>{
    e.stopPropagation();
    mapZoomLevel = Math.min(2.5, mapZoomLevel + 0.25);
    canvasEl.style.transform = `scale(${mapZoomLevel})`;
  });
  document.getElementById('mapZoomOut').addEventListener('click', (e)=>{
    e.stopPropagation();
    mapZoomLevel = Math.max(0.7, mapZoomLevel - 0.25);
    canvasEl.style.transform = `scale(${mapZoomLevel})`;
  });

  const close = ()=> overlay.remove();
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
  document.getElementById('mapCancelBtn').addEventListener('click', close);
  document.getElementById('mapSelectBtn').addEventListener('click', ()=>{
    if(specInputEl){
      specInputEl.value = nadereInput.value || locatieLabel;
    }
    close();
  });
  document.addEventListener('keydown', function escHandler(e){
    if(e.key === 'Escape'){ close(); document.removeEventListener('keydown', escHandler); }
  });
}

function wireLocationDropdown(scopeEl, stepData){
  scopeEl.querySelectorAll('.loc-search-input').forEach(input=>{
    const wrap = input.closest('.loc-field-wrap');
    const dropdown = wrap ? wrap.querySelector('.loc-dropdown') : null;
    const inputWrap = wrap ? wrap.querySelector('.loc-input-wrap') : null;
    const clearIcon = wrap ? wrap.querySelector('.loc-clear-icon') : null;
    if(!dropdown) return;

    const syncClearIcon = ()=>{
      if(inputWrap) inputWrap.classList.toggle('has-value', !!input.value);
    };
    syncClearIcon();

    const refresh = ()=>{
      dropdown.innerHTML = buildLocationDropdownHtml(input.value);
      dropdown.querySelectorAll('.loc-item').forEach(item=>{
        item.addEventListener('mousedown', (e)=>{
          // mousedown (i.p.v. click) zodat dit vóór de blur van het inputveld vuurt
          e.preventDefault();
          input.value = item.dataset.value;
          dropdown.classList.remove('open');
          syncClearIcon();
          const mapBtn = wrap.parentElement ? wrap.parentElement.querySelector('.loc-map-btn') : null;
          const specInput = wrap.parentElement ? wrap.parentElement.querySelector('.f-locatie-spec') : null;
          const isVaarweg = item.dataset.cat === 'Vaarweg';
          if(stepData) stepData.form.locatieIsVaarweg = isVaarweg;
          if(mapBtn) mapBtn.style.display = isVaarweg ? 'flex' : 'none';
          if(isVaarweg){
            openLocationMapPopup(item.dataset.value, specInput, specInput ? specInput.value : '');
          }
        });
      });
    };

    input.addEventListener('focus', ()=>{ refresh(); dropdown.classList.add('open'); });
    input.addEventListener('input', ()=>{ refresh(); dropdown.classList.add('open'); syncClearIcon(); });
    input.addEventListener('blur', ()=>{ dropdown.classList.remove('open'); });

    if(clearIcon){
      clearIcon.addEventListener('mousedown', (e)=>{
        e.preventDefault();
        input.value = '';
        syncClearIcon();
        refresh();
        input.focus();
      });
    }
  });
}

function setStepEditMode(card, editing){
  const s = card._stepData;
  const bodyEl = card.querySelector('.step-body');
  if(!s || !bodyEl) return;
  card.classList.toggle('editing', editing);
  if(editing){
    const formType = s.form.type;
    if(formType === 'watermanagement'){
      bodyEl.innerHTML = buildWatermanagementEditHtml(s);
    } else if(formType === 'melding'){
      bodyEl.innerHTML = buildMeldingEditHtml(s);
    } else if(formType === 'opmerking'){
      bodyEl.innerHTML = buildOpmerkingEditHtml(s);
    } else if(formType === 'mvl'){
      bodyEl.innerHTML = buildMvlEditHtml(s);
    } else {
      bodyEl.innerHTML = buildOvertredingEditHtml(s);
    }

    if(formType === 'overtreding' || formType === 'watermanagement'){
      wireLocationDropdown(bodyEl, s);
      // "Naar kaart" knop: alleen zichtbaar/relevant als de gekozen locatie een vaarweg is
      const mapBtn = bodyEl.querySelector('.loc-map-btn');
      if(mapBtn){
        mapBtn.addEventListener('click', ()=>{
          const specInput = bodyEl.querySelector('.f-locatie-spec');
          const locatieInput = bodyEl.querySelector('.f-locatie');
          openLocationMapPopup(locatieInput.value, specInput, specInput ? specInput.value : '');
        });
      }
    }

    if(formType === 'overtreding'){
      wireVesselDropdown(bodyEl);
      // Beroepsvaart -> doorzoekbare vaartuiglijst, Recreatievaart -> tekstveld
      const beroepsWrap = bodyEl.querySelector('.vessel-field-beroeps');
      const recreatieWrap = bodyEl.querySelector('.vessel-field-recreatie');
      bodyEl.querySelectorAll('.f-vaarttype').forEach(radio=>{
        radio.addEventListener('change', ()=>{
          if(radio.checked){
            beroepsWrap.style.display = radio.value === 'Beroepsvaart' ? 'block' : 'none';
            recreatieWrap.style.display = radio.value === 'Recreatievaart' ? 'block' : 'none';
          }
        });
      });
    }

    bodyEl.querySelector('.edit-cancel').addEventListener('click', ()=> setStepEditMode(card, false));
    bodyEl.querySelector('.edit-save').addEventListener('click', ()=>{
      // Prototype: velden overnemen in het geheugen-model (geen backend)
      s.form.datum = bodyEl.querySelector('.f-datum').value;
      s.form.tijd = bodyEl.querySelector('.f-tijd').value;
      s.time = s.form.tijd;

      if(formType === 'watermanagement'){
        s.form.toelichting = bodyEl.querySelector('.f-toelichting').value;
        s.form.locatie = bodyEl.querySelector('.f-locatie').value;
        s.form.locatieSpecificatie = bodyEl.querySelector('.f-locatie-spec').value;
        s.form.activiteit = bodyEl.querySelector('.f-activiteit').value;
        s.detail = s.form.activiteit;
      } else if(formType === 'melding'){
        s.form.toelichting = bodyEl.querySelector('.f-toelichting').value;
        s.form.soort = bodyEl.querySelector('.f-soort').value;
        s.detail = s.form.soort;
      } else if(formType === 'opmerking'){
        s.form.titel = bodyEl.querySelector('.f-titel').value;
        s.form.opmerking = bodyEl.querySelector('.f-opmerking').value;
        s.name = s.form.titel ? `Opmerking - ${s.form.titel}` : 'Opmerking';
        s.detail = s.form.opmerking.slice(0, 60) + (s.form.opmerking.length > 60 ? '…' : '');
      } else if(formType === 'mvl'){
        s.form.vaartuigWerkplek = bodyEl.querySelector('.f-vaartuig-werkplek').value;
        s.form.telefoonnummer = bodyEl.querySelector('.f-telefoonnummer').value;
        s.form.toelichting = bodyEl.querySelector('.f-toelichting').value;
      } else {
        s.form.toelichting = bodyEl.querySelector('.f-toelichting').value;
        s.form.locatie = bodyEl.querySelector('.f-locatie').value;
        s.form.locatieSpecificatie = bodyEl.querySelector('.f-locatie-spec').value;
        const vt = bodyEl.querySelector('.f-vaarttype:checked');
        if(vt) s.form.vaarttype = vt.value;
        s.form.varendeEenheid = (s.form.vaarttype === 'Recreatievaart')
          ? bodyEl.querySelector('.f-eenheid-recreatie').value
          : bodyEl.querySelector('.vessel-search-input').value;
        s.form.reden = bodyEl.querySelector('.f-reden').value;
        s.form.waarschuwingGegeven = bodyEl.querySelector('.f-waarschuwing').checked;
        s.form.opvolgingNodig = bodyEl.querySelector('.f-opvolging').checked;
        s.detail = s.form.reden;
      }

      setStepEditMode(card, false);
      refreshCompactHeaderInPlace();

      // Alleen een status-overgang naar "In behandeling" bij een hernieuwde
      // bewerking - niet tijdens het allereerst aanmaken (dat blijft Aangemeld).
      const currentEv = getCurrentEv();
      if(currentEv && currentEv !== adhocSelection){
        markEventChanged(currentEv);
      }
    });
  } else {
    bodyEl.innerHTML = buildStepBodyHtml(s);
    wireStepBodyLinks(card);
    // koptekst (tijd/naam/detail) van het kaartje bijwerken na eventuele wijziging
    const timeEl = card.querySelector('.step-time');
    const nameEl = card.querySelector('.step-name');
    const detailEl = card.querySelector('.step-detail');
    if(timeEl) timeEl.textContent = s.time;
    if(nameEl) nameEl.textContent = s.name;
    if(detailEl) detailEl.textContent = s.detail || '';
  }
}

function wireStepBodyLinks(card){
  const wijzigenLink = card.querySelector('.wijzigen-link');
  if(wijzigenLink){
    wijzigenLink.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(card._stepData && card._stepData.form && card._stepData.form.editable){
        setStepEditMode(card, true);
      } else {
        alert('Nog niet beschikbaar in prototype');
      }
    });
  }
}

function buildFooterTabsHtml(s){
  const n = s.num ? parseInt(s.num, 10) : 0;
  const tabs = ['Origineel'];
  for(let i=1;i<=n;i++) tabs.push(String(i));
  const activeIdx = tabs.length - 1; // laatste (huidige) versie is standaard actief
  return tabs.map((t,i)=>`<div class="footer-tab ${i===activeIdx?'active':''}" data-tab-idx="${i}">${t}</div>`).join('');
}

function buildStepBodyHtml(s){
  if(s.form && s.form.type === 'overtreding'){
    return buildOvertredingReadHtml(s);
  }
  if(s.form && s.form.type === 'watermanagement'){
    return buildWatermanagementReadHtml(s);
  }
  if(s.form && s.form.type === 'melding'){
    return buildMeldingReadHtml(s);
  }
  if(s.form && s.form.type === 'opmerking'){
    return buildOpmerkingReadHtml(s);
  }
  if(s.form && s.form.type === 'mvl'){
    return buildMvlReadHtml(s);
  }
  if(s.form && s.form.type === 'fields'){
    const f = s.form;
    const colsHtml = f.columns.map(col=>{
      if(col.length === 2 && col[0].inline && col[1].inline){
        return `
          <div class="form-fields-col">

              <div class="form-field">
                <div class="flabel">${col[0].label}</div>
                <div class="fval">${col[0].value}</div>

              <div class="form-field">
                <div class="flabel">${col[1].label}</div>
                <div class="fval">${col[1].value}</div>
              </div>
            </div>

      }
      return `
        <div class="form-fields-col">
          ${col.map(fld=>`
            <div class="form-field">
              <div class="flabel">${fld.label}</div>
              <div class="fval">${fld.value || '&nbsp;'}</div>

    }).join('');
    return `

        <div class="footer-actions">

        </div>

  }
  if(s.form){
    const f = s.form;
    return `
      <div class="form-grid">
        <div>
          <div class="form-row-inline">
            <div class="form-field">
              <div class="flabel">Gebeurtenis*</div>

          </div>
          <div class="form-row-inline">
            <div class="form-field">
              <div class="flabel">Datum*</div>
              <div class="fval">${f.datum}</div>
            </div>
            <div class="form-field">
              <div class="flabel">Tijd*</div>
              <div class="fval">${f.tijd}</div>
            </div>
          </div>
          <div class="form-section-title" style="margin-top:10px;">${f.section}</div>
          <div class="form-field">
            <div class="flabel">${f.primaryLabel}</div>
            <div class="fval fval-with-icon">
              <span>${f.primaryValue}</span>
              ${f.showIcon ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#e8b73d" stroke-width="1.8"><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.3"/></svg>' : ''}
            </div>

// Volgorde van het protocol volgt exact de Melding- en Registratie-blokken
// uit het Vervolgmenu (zelfde bron, dus altijd synchroon).
const PROTOCOL_LABELS = [
  ...VERVOLG_MENU.find(s=>s.section==='Melding').items,
  ...VERVOLG_MENU.find(s=>s.section==='Registratie voor scheepsongeval').items,
].map(it => typeof it === 'string' ? it : it.label);

// Koppeling tussen protocol-item en de naam van de bijbehorende processtap
// in de tijdlijn. Items zonder koppeling zijn nooit "af" (altijd TO DO) in
// dit prototype, omdat er nog geen kaartje-type voor bestaat.
const PROTOCOL_STEP_NAME_MAP = {
  'Waar':'Constatering incident - Waar',
  'Wie':'Constatering incident - Wie',
  'Wat':'Constatering incident - Wat',
  'Aard ongeval':'Aard ongeval',
};

function protocolDisplayLabel(label){
  return ['Waar','Wie','Wat'].includes(label) ? ('Constatering ' + label) : label;
}

function findProtocolStep(detail, label){
  const stepName = PROTOCOL_STEP_NAME_MAP[label];
  if(!stepName) return null;
  for(const group of detail.timeline){
    for(const s of group.steps){
      if(s.name === stepName) return {...s, date:group.date};
    }
  }
  return null;
}

function buildProtocolRows(detail){
  return PROTOCOL_LABELS.map(label=>{
    const found = findProtocolStep(detail, label);
    return {
      label,
      display: protocolDisplayLabel(label),
      done: !!found,
      dateTime: found ? `${found.date} ${found.time}` : null,
      step: found,
    };
  });
}

function openProtocolModal(detail){
  const existing = document.getElementById('protocolModalOverlay');
  if(existing) existing.remove();

  const rows = buildProtocolRows(detail);

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'protocolModalOverlay';
  overlay.innerHTML = `

      </div>

        ${rows.map((r,i)=>`
          <div class="protocol-row" data-idx="${i}">
            <span class="lab">${r.display}</span>
            <span class="val ${r.done?'':'todo'}">${r.done ? r.dateTime : 'TO DO'}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const close = ()=> overlay.remove();
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
  document.getElementById('protocolModalClose').addEventListener('click', close);
  overlay.querySelectorAll('.protocol-row').forEach((rowEl, i)=>{
    rowEl.addEventListener('click', ()=>{

        close();
        openStepModal(r.display, r.step);

      }
    });
  });

    if(e.key === 'Escape'){ close(); document.removeEventListener('keydown', escHandler); }
  });
}

/* ============ Nieuwe Overtreding MF ============ */
function pad2(n){ return String(n).padStart(2,'0'); }
function randomCredential(){
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  return letters[Math.floor(Math.random()*26)] + letters[Math.floor(Math.random()*26)];
}

function buildFreshOvertreding(){
  const now = new Date();
  const datum = `${pad2(now.getDate())}-${pad2(now.getMonth()+1)}-${now.getFullYear()}`;
  const tijd = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
  const naamVaartuig = 'Willem van Nassau';
  const reden = 'Door rood licht varen';
  const locatie = 'SLUIS WEURT - Westkolk';

  return {
    headerLine1: `${tijd} · Overtreding · ${naamVaartuig}`,
    headerLine2: reden,
    dossier: 'Dossier #000000 Nieuw',
    protocol:[
      ['Constatering', `${datum} ${tijd}`],
      ['Status','Aangemeld'],
      ['Looptijd (uu:mm)','00:00'],
      ['Einde','-'],
    ],
    waar: locatie,
    wie: { betrokkenen:[ {label:naamVaartuig, icons:['boat']} ], hulpverleners:[] },
    timeline:[
      {date:datum, steps:[
        {
          time:tijd, num:null, name:'Overtreding', detail:reden, roles:['RV', randomCredential()],
          form:{
            type:'overtreding',
            editable:true,
            gebeurtenis:'Overtreding geconstateerd',
            datum, tijd,
            vaarttype:'Beroepsvaart',
            varendeEenheid:naamVaartuig,
            reden,
            locatie,
            locatieSpecificatie:'',
            locatieIsVaarweg:false,
            waarschuwingGegeven:false,
            opvolgingNodig:false,
            toelichting:''
          }
        }
      ]}
    ]
  };
}

// Bouwt de lijst-item data voor een net aangemaakte gebeurtenis, op basis van
// de (mogelijk bewerkte) waarden in het opgeslagen formulier.
function buildAdhocListEntry(ev){
  const f = ev.detail.timeline[0].steps[0].form;
  if(ev.type === 'overtreding'){
    return {
      id:'', type:'overtreding',
      title:`Overtreding - ${f.varendeEenheid}`,
      desc:`${f.reden} - geconstateerd op ${f.datum} ${f.tijd}`,
      status:'aangemeld', statusLabel:'Aangemeld', badge:'-',
      detail: ev.detail
    };
  }
  if(ev.type === 'watermanagement'){
    return {
      id:'', type:'watermanagement',
      title:`Watermanagement - ${f.locatie}`,
      desc:`${f.activiteit} - geconstateerd op ${f.datum} ${f.tijd}`,
      status:'aangemeld', statusLabel:'Aangemeld', badge:'-',
      detail: ev.detail
    };
  }
  if(ev.type === 'melding'){
    return {
      id:'', type:'melding',
      title:`Melding - ${f.soort}`,
      desc:`Geconstateerd op ${f.datum} ${f.tijd}`,
      status:'aangemeld', statusLabel:'Aangemeld', badge:'-',
      detail: ev.detail
    };
  }
  return null;
}

// Pas bij het opslaan van de EERSTE processtap wordt de gloednieuwe
// gebeurtenis echt aan de gebeurtenislijst toegevoegd.
// Status-overgang: een nieuwe gebeurtenis is "Aangemeld" totdat er iets aan
// gewijzigd wordt (extra processtap, hernieuwde bewerking) — dan pas
// "In behandeling". Werkt niet meer als de gebeurtenis al is beëindigd.
function markEventChanged(ev){
  if(!ev || ev.status === 'behandeling' || ev.status === 'beeindigd') return;
  ev.status = 'behandeling';
  ev.statusLabel = 'In behandeling';
  if(ev.detail && ev.detail.protocol){
    const statusField = ev.detail.protocol.find(p=>p[0]==='Status');
    if(statusField) statusField[1] = 'In behandeling';
  }
  renderList();
  if(getCurrentEv() === ev) renderRight();
}

function commitAdhocEvent(ev){
  const entry = buildAdhocListEntry(ev);
  if(!entry) return;
  events.unshift(entry);
  if(adhocSelection === ev){
    selectedIndex = 0;
    adhocSelection = null;
  }
  renderList();
  // Rechterpaneel opnieuw koppelen aan het nieuwe lijst-item (andere object-
  // identiteit dan de tijdelijke adhocSelection), zodat knoppen als
  // +Opmerking daarna weer correct werken.
  renderRight();
}

// Wanneer de gebruiker de EERSTE (nog nooit opgeslagen) processtap
// annuleert, vervalt de hele concept-gebeurtenis weer volledig.
function discardAdhocEvent(ev){
  if(adhocSelection === ev){
    adhocSelection = null;
    renderRight();
  }
}

function wireFirstCardCommit(ev, firstCard){
  const saveBtn = firstCard.querySelector('.edit-save');
  const cancelBtn = firstCard.querySelector('.edit-cancel');
  if(saveBtn) saveBtn.addEventListener('click', ()=> commitAdhocEvent(ev));
  if(cancelBtn) cancelBtn.addEventListener('click', ()=> discardAdhocEvent(ev));
}

// Sluit een Melding af via de Vervolg-opties "Sleutelinname" / "Persoon verlaat object".
// Voegt een afsluitend kaartje toe, zet de status op Beëindigd en verplaatst de
// gebeurtenis (weg uit Actueel) richting Historie.
function endMelding(ev, actionLabel){
  if(ev.status === 'beeindigd') return; // al beëindigd, niet nogmaals afsluiten

  const now = new Date();
  const datum = `${pad2(now.getDate())}-${pad2(now.getMonth()+1)}-${now.getFullYear()}`;
  const d = ev.detail;

  const closingStep = {
    time:`${pad2(now.getHours())}:${pad2(now.getMinutes())}`, num:null, name:actionLabel, detail:'Gebeurtenis beëindigd', roles:['RV', randomCredential()]
  };
  // Nieuwste stap bovenaan: zelfde datum -> vooraan in de bestaande groep,
  // andere datum -> nieuwe groep vooraan.
  if(d.timeline.length && d.timeline[0].date === datum){
    d.timeline[0].steps.unshift(closingStep);
  } else {
    d.timeline.unshift({date:datum, steps:[closingStep]});
  }

  const statusField = d.protocol.find(p=>p[0]==='Status');
  if(statusField) statusField[1] = 'Beëindigd';
  const eindeField = d.protocol.find(p=>p[0]==='Einde');
  if(eindeField) eindeField[1] = `${datum} ${closingStep.time}`;

  ev.status = 'beeindigd';
  ev.statusLabel = 'Beëindigd';

  // Uit Actueel halen en naar Historie verplaatsen (nieuwste bovenaan)
  const idx = events.indexOf(ev);
  if(idx > -1) events.splice(idx, 1);
  historyEvents.unshift(ev);
  historySelectedIndex = 0;

  selectedIndex = 0;
  adhocSelection = null;
  renderList();
  renderRight();
}

/* ============ LIST COLLAPSE / EXPAND ============ */
const leftPanelWrap = document.getElementById('leftPanelWrap');
const collapseRail = document.getElementById('collapseRail');

function setListCollapsed(collapsed){
  listCollapsed = collapsed;
  leftPanelWrap.classList.toggle('collapsed', collapsed);
}

collapseRail.addEventListener('click', ()=>{
  setListCollapsed(!listCollapsed);
});

/* ============ RESPONSIVE: auto-collapse op tablet-formaat of kleiner ============ */
function applyResponsiveCollapse(){
  const isNarrow = window.innerWidth <= TABLET_MAX;
  // Alleen automatisch dichtklappen op het moment dat het scherm van breed
  // naar smal gaat. Handmatig weer uitklappen door de gebruiker blijft
  // daarna mogelijk, ook al blijft het scherm smal.
  if(isNarrow && !wasNarrow){
    setListCollapsed(true);
    setInfoCollapsed(true);
  }
  wasNarrow = isNarrow;
}

// initiële staat bij page load
if(window.innerWidth <= TABLET_MAX){
  listCollapsed = true;
  infoCollapsed = true;
}

let resizeTimer;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(applyResponsiveCollapse, 120);
});

/* ============ CLOCK ============ */
function updateClock(){
  const now = new Date();
  const dd = String(now.getDate()).padStart(2,'0');
  const mm = String(now.getMonth()+1).padStart(2,'0');
  const yyyy = now.getFullYear();
  const hh = String(now.getHours()).padStart(2,'0');
  const min = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('navDateTime').textContent = `${dd}-${mm}-${yyyy} ${hh}:${min}`;
}
updateClock();
setInterval(updateClock, 30000);

/* ============ INIT ============ */
if(listCollapsed){ leftPanelWrap.classList.add('collapsed'); }
renderList();
renderRight();
</script>
